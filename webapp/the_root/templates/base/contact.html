{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Contact</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'homecss/homestyles.css' %}" rel="stylesheet" />
    </head>
    <body>
             <!-- Responsive navbar-->
        <nav class="navbar navbar-expand-lg navbar-dark nav-custom" >
            <div class="container">
                <a class="navbar-brand" href="#!">Start Bootstrap</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0"> 
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="{% url 'home' %}">Blog</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <div class="container py-5">
            <div class="row justify-content-center">
            <div class="col-md-8 contact-form">
                <h2 class="text-center mb-4">Get in Touch</h2>
                <form>
                    <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required />
                    </div>
                    <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required />
                    </div>
                    <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" placeholder="Subject" />
                    </div>
                    <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>
                    <div class="text-center">
                    <button type="submit" class="btn btn-outline-info px-4">Send Message</button>
                    </div>
                </form>
                </div>
            </div>
            </div>

        <!-- Footer-->
        <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="{% static 'bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script><!-- Core theme JS-->
        <script src="{% static 'homejs/homescripts.js' %}"></script>
    </body>
</html>
